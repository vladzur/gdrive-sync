name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La toolchain sale de rust-toolchain.toml (fijada en el repositorio).
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.92.0 build --workspace

  duplicates:
    name: Duplicate dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-duplicates.sh

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # Verifica que GTK4 y Libadwaita compilen juntos con las features elegidas
  # (Anexo F del plan). El piso de API es gtk4 v4_14 y el runner se fija en
  # Ubuntu 24.04 a propósito: trae GTK 4.14, así que este job compila contra el
  # mínimo soportado (GNOME 46). Con `ubuntu-latest` el piso dejaría de probarse
  # en cuanto la etiqueta migre a una versión más nueva de la distro.
  gui:
    name: GUI dependencies (GTK4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK4 and Libadwaita development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p gdrive-sync-gui --features gui
