[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["gdrive-sync contributors"]

# Todas las versiones viven aquí (ADR-013). Los crates internos las heredan con
# `workspace = true`, de modo que una actualización se hace en un solo lugar.
# Las dependencias de GUI son opcionales: sin la feature `gui` el workspace
# compila en entornos sin GTK (CI headless, servidores).
[workspace.dependencies]
# --- Crates internos ---
gdrive-sync-core = { path = "crates/core", version = "0.1.0" }
gdrive-sync-auth = { path = "crates/auth", version = "0.1.0" }
gdrive-sync-drive = { path = "crates/drive", version = "0.1.0" }
gdrive-sync-db = { path = "crates/db", version = "0.1.0" }
gdrive-sync-watcher = { path = "crates/watcher", version = "0.1.0" }
gdrive-sync-engine = { path = "crates/engine", version = "0.1.0" }

# --- GUI (Hito 4; requiere libgtk-4-dev y libadwaita-1-dev) ---
# El feature de versión fija el *piso* de API. v4_14 cubre GNOME 46 en adelante
# (GNOME 46 = GTK 4.14, 47 = 4.16, 48 = 4.18, 49 = 4.20, 50 = 4.22, 51 = 4.24),
# que es la matriz de compatibilidad del plan (T0.9).
gtk4 = { version = "0.11.5", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_4"] }

# --- Asincronía y red ---
# Sin `features = ["full"]`: solo lo que el proyecto usa (menos superficie y tamaño).
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
futures-util = "0.3.34"
# `rustls-no-provider` evita `aws-lc-rs` (exige cmake/nasm). El proveedor `ring`
# se declara aparte y se instala en `gdrive_sync_core::tls::init()`.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "http2",
    "gzip",
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# --- OAuth2 y almacenamiento de secretos ---
oauth2 = { version = "5.0.0", default-features = false }
oo7 = { version = "0.6.0", features = ["tokio", "native_crypto"] }

# --- Monitoreo de archivos y persistencia ---
notify = { version = "8.2.0" }
notify-types = { version = "2.1.0" }
notify-debouncer-full = { version = "0.7.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"

# --- Utilidades ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"

# --- Desarrollo ---
tempfile = "3.27.0"
rstest = "0.27.0"
mockall = "0.15.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# `pedantic` activo y curado: las excepciones están justificadas, no son deuda.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
